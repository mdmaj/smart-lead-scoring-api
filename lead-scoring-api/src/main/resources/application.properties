spring.application.name=lead-scoring-api

spring.datasource.url=jdbc:mysql://localhost:3306/lead_scoring_db
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=5000


# PostgreSQL Audit Database
spring.postgres.datasource.url=jdbc:postgresql://localhost:5432/lead_scoring_audit
spring.postgres.datasource.username=postgres
spring.postgres.datasource.password=${POSTGRES_PASSWORD}
